name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/m2ops

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: flake8 src tests

      - name: Run tests
        run: python -m pytest -q

      - name: Normalize container image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:${GITHUB_SHA::7} .
          docker build -t $IMAGE_NAME:$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7} .

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          TAG=$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}
          docker tag $IMAGE_NAME:${GITHUB_SHA::7} $IMAGE_NAME:$TAG
          docker push $IMAGE_NAME:$TAG
          docker push $IMAGE_NAME:${GITHUB_SHA::7}
